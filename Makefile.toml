[config]
default_to_workspace = false
skip_core_tasks = true

[env]
BUNDLE_ID = "net.riseonly.desktop"
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = "true"
# One log filter for every dev-* task: the app binary plus each crate that logs.
RISE_DEV_LOG = "riseonly=debug,rise_engine=debug,rise_platform=debug,rise_media=debug,rise_ui=debug,rise_widgets=debug"

[tasks.default]
alias = "dev"

[tasks.dev]
description = "Run the app on the current OS"
run_task = [
    { name = "dev-macos", condition = { platforms = ["mac"] } },
    { name = "dev-linux", condition = { platforms = ["linux"] } },
    { name = "dev-win", condition = { platforms = ["windows"] } },
]

# macOS runs from a real .app bundle, never a bare binary: Keychain ACLs,
# UserNotifications and MPNowPlayingInfoCenter all key off the bundle identity.
[tasks.dev-macos]
description = "Build, bundle and launch Riseonly.app (debug). --design opens the storybook"
script_runner = "@shell"
script = '''
if [ "$(uname -s)" != "Darwin" ]; then
    echo "dev-macos must run on macOS."
    exit 1
fi
cd "${CARGO_MAKE_WORKING_DIRECTORY}"
cargo build -p riseonly
# The bundle is named for the environment it was compiled for, so the script
# reports where it put it rather than the caller guessing.
BUNDLE="$(./scripts/bundle-macos.sh debug | sed -n 's/^bundled: \(.*\)  (.*)$/\1/p')"
. ./scripts/dev-args.sh
open -n "$BUNDLE" --args "$@"
'''

[tasks.dev-macos.mac.env]
RUST_BACKTRACE = "1"
RUST_LOG = "${RISE_DEV_LOG}"

[tasks.dev-linux]
description = "Build and launch on Linux (X11 or Wayland, chosen at runtime). --design opens the storybook"
script_runner = "@shell"
script = '''
if [ "$(uname -s)" != "Linux" ]; then
    echo "dev-linux must run on Linux."
    echo "A GPUI app cannot be cross-run: the window server, text stack and"
    echo "renderer all come from the host. Build on the target OS."
    exit 1
fi
cd "${CARGO_MAKE_WORKING_DIRECTORY}"
cargo build -p riseonly
. ./scripts/dev-args.sh
# The builder compiles into its own CARGO_TARGET_DIR; ./target is only the default.
exec "${CARGO_TARGET_DIR:-target}/debug/riseonly" "$@"
'''

[tasks.dev-linux.linux.env]
RUST_BACKTRACE = "1"
RUST_LOG = "${RISE_DEV_LOG}"

[tasks.dev-win]
description = "Build and launch on Windows. --design opens the storybook"
condition = { platforms = ["windows"] }
script_runner = "@duckscript"
# dev-args.sh is POSIX sh, which a stock Windows host does not have, so --design
# is translated here to the same LAUNCH_ARGUMENT
# (app/src/app/storybook/storybook.rs). Other arguments are not forwarded.
script = '''
cd ${CARGO_MAKE_WORKING_DIRECTORY}
target_dir = get_env CARGO_TARGET_DIR
if is_empty ${target_dir}
    target_dir = set target
end
exec --fail-on-error cargo build -p riseonly
task_args = get_env CARGO_MAKE_TASK_ARGS
design = contains "${task_args}" --design
if ${design}
    exec --fail-on-error ${target_dir}/debug/riseonly.exe -riseStorybook
else
    exec --fail-on-error ${target_dir}/debug/riseonly.exe
end
'''

[tasks.dev-win.windows.env]
RUST_BACKTRACE = "1"
RUST_LOG = "${RISE_DEV_LOG}"

[tasks.watch]
description = "Rebuild on every change and restart the windows (macOS). --check, --drive NAME, --headless, --linux, --windows, --env, --help"
script_runner = "@shell"
script = '''
cd "${CARGO_MAKE_WORKING_DIRECTORY}"
exec ./scripts/watch-macos.sh "$@"
'''

[tasks.watch.env]
RUST_LOG = "${RISE_DEV_LOG}"

# The riseonly binary enables `rlottie` by default (app/Cargo.toml), so every
# workspace build compiles rise-media against the vendored rlottie source; without
# it rise-media's build.rs panics. vendor-rlottie is a no-op once the tree exists.
[tasks.build]
description = "Build every workspace crate, the riseonly binary included"
dependencies = ["vendor-rlottie"]
command = "cargo"
args = ["build", "--workspace"]

# Default features only: `rlottie` is one of them (vendored first), `ffmpeg` is
# not, because it needs a prefix built by build-ffmpeg and exists on macOS only.
# `cargo make test-media` is where the FFmpeg backend is exercised.
[tasks.test]
description = "Run the whole test suite headlessly"
dependencies = ["vendor-rlottie"]
command = "cargo"
args = ["test", "--workspace"]

[tasks.fmt]
command = "cargo"
args = ["fmt", "--all"]

[tasks.fmt-check]
command = "cargo"
args = ["fmt", "--all", "--check"]

[tasks.clippy]
dependencies = ["vendor-rlottie"]
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]

[tasks.parity]
description = "Report port progress against riseonly-ios"
script_runner = "@shell"
script = '''
cd "${CARGO_MAKE_WORKING_DIRECTORY}"
python3 ./scripts/check-tree-parity.py
'''

[tasks.boundaries]
description = "Enforce the architectural boundaries (engine purity, generated OS cfg, OS layers only in seams)"
script_runner = "@shell"
script = '''
cd "${CARGO_MAKE_WORKING_DIRECTORY}"
python3 ./scripts/check-boundaries.py
'''

[tasks.design-tokens]
description = "Keep colour and length literals inside rise-theme"
script_runner = "@shell"
script = '''
cd "${CARGO_MAKE_WORKING_DIRECTORY}"
python3 ./scripts/check-design-tokens.py
'''

[tasks.mod-tree]
description = "Fail when a generated mod tree drifted from the files on disk"
script_runner = "@shell"
script = '''
cd "${CARGO_MAKE_WORKING_DIRECTORY}"
python3 ./scripts/gen-mod-tree.py --check
'''

# Same guard as riseonly-ios scripts/canon-sync-check.sh: the locales in
# assets/locales must match what riseonly-tools generates. RISEONLY_TOOLS
# overrides the sibling checkout; the workspace is pinned to this tree's parent so
# the tools script checks this copy and not another riseonly-desktop.
[tasks.canon]
description = "Fail when assets/locales drifted from riseonly-tools"
script_runner = "@shell"
script = '''
cd "${CARGO_MAKE_WORKING_DIRECTORY}"
ROOT="$(pwd)"
TOOLS="${RISEONLY_TOOLS:-$(dirname "$ROOT")/riseonly-tools}"
if [ ! -f "$TOOLS/scripts/sync-to-clients.sh" ]; then
    echo "canon: no riseonly-tools at $TOOLS (set RISEONLY_TOOLS)" >&2
    exit 2
fi
RISEONLY_WORKSPACE="$(dirname "$ROOT")" bash "$TOOLS/scripts/sync-to-clients.sh" --only desktop --check
'''

[tasks.build-ffmpeg]
description = "Build the LGPL-only FFmpeg prefix rise-media links against"
script_runner = "@shell"
script = '''
cd "${CARGO_MAKE_WORKING_DIRECTORY}"
./scripts/build-ffmpeg-lgpl.sh
'''

[tasks.vendor-rlottie]
description = "Fetch the pinned rlottie source rise-media compiles into itself"
script_runner = "@shell"
script = '''
cd "${CARGO_MAKE_WORKING_DIRECTORY}"
./scripts/vendor-rlottie.sh
'''

[tasks.rlottie-license]
description = "Re-derive rlottie's licensing from the vendored tree"
script_runner = "@shell"
script = '''
cd "${CARGO_MAKE_WORKING_DIRECTORY}"
python3 ./scripts/check-rlottie-license.py
'''

[tasks.ffmpeg-license]
description = "Re-derive FFmpeg's licence from the built artefact"
script_runner = "@shell"
script = '''
cd "${CARGO_MAKE_WORKING_DIRECTORY}"
python3 ./scripts/check-ffmpeg-license.py
'''

# The default `cargo make test` already runs rlottie (vendored first); FFmpeg
# needs the LGPL prefix from build-ffmpeg, which only the macOS build links. This
# is the task that proves the LINKED libraries work, the claims a script edit
# cannot fake.
[tasks.test-media]
description = "rise-media against the real FFmpeg and rlottie (macOS only: FFmpeg is off on Linux and Windows)"
condition = { platforms = ["mac"] }
dependencies = ["build-ffmpeg", "vendor-rlottie"]
command = "cargo"
args = ["test", "-p", "rise-media", "--features", "ffmpeg,rlottie"]

[tasks.test-stickers]
description = "rise-media against the real rlottie only (no FFmpeg prefix needed)"
dependencies = ["vendor-rlottie"]
command = "cargo"
args = ["test", "-p", "rise-media", "--features", "rlottie"]

[tasks.lint]
dependencies = ["fmt-check", "clippy", "boundaries", "design-tokens", "mod-tree", "canon", "ffmpeg-license", "rlottie-license"]

[tasks.ci]
dependencies = ["lint", "build", "test"]

[tasks.bundle-macos]
description = "Build a release .app bundle"
condition = { platforms = ["mac"] }
script_runner = "@shell"
script = '''
cd "${CARGO_MAKE_WORKING_DIRECTORY}"
cargo build -p riseonly --release
./scripts/bundle-macos.sh release
'''

[tasks.clean]
command = "cargo"
args = ["clean"]

[tasks.set-dev-url]
description = "Point dev builds at a backend host (detects the LAN IP by default)"
script_runner = "@shell"
script = '''
cd "${CARGO_MAKE_WORKING_DIRECTORY}"
./scripts/set-dev-url.sh "$@"
'''

[tasks.dev-staging]
description = "Run against staging"
env = { RISE_ENV = "staging" }
run_task = "dev"

# Canon names the environment `production` (riseonly-tools canon/deep_links.json);
# `prod` stays an accepted alias there and here.
[tasks.dev-production]
description = "Run against production"
env = { RISE_ENV = "production" }
run_task = "dev"

[tasks.dev-prod]
alias = "dev-production"
