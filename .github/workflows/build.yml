name: build

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number }}-${{ ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || contains(fromJSON('["build","tests","release-profile","macos","macos-silicon","macos-intel","macos-local","linux-local","win-local","linux","linux-x64","linux-arm64","win","win-x64","win-arm64","env-dev","env-staging","env-prod"]'), github.event.label.name)) && 'build' || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      run: ${{ steps.plan.outputs.run }}
      linux: ${{ steps.plan.outputs.linux }}
      windows: ${{ steps.plan.outputs.windows }}
      macos: ${{ steps.plan.outputs.macos }}
      linux_archs: ${{ steps.plan.outputs.linux_archs }}
      windows_archs: ${{ steps.plan.outputs.windows_archs }}
      macos_archs: ${{ steps.plan.outputs.macos_archs }}
      macos_runner: ${{ steps.plan.outputs.macos_runner }}
      macos_local: ${{ steps.plan.outputs.macos_local }}
      linux_runners: ${{ steps.plan.outputs.linux_runners }}
      linux_local: ${{ steps.plan.outputs.linux_local }}
      windows_runner: ${{ steps.plan.outputs.windows_runner }}
      windows_local: ${{ steps.plan.outputs.windows_local }}
      tests: ${{ steps.plan.outputs.tests }}
      environment: ${{ steps.plan.outputs.environment }}
      profile: ${{ steps.plan.outputs.profile }}
      version: ${{ steps.plan.outputs.version }}
      build_number: ${{ steps.plan.outputs.build_number }}
      slug: ${{ steps.plan.outputs.slug }}
      sha: ${{ steps.plan.outputs.sha }}
      tools_repo: ${{ steps.plan.outputs.tools_repo }}
      tools_ref: ${{ steps.plan.outputs.tools_ref }}
      rust: ${{ steps.plan.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            scripts/ci
            Cargo.toml
          sparse-checkout-cone-mode: false
      - name: Labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          ACTION: ${{ github.event.action }}
        run: bash scripts/ci/labels.sh
      - id: plan
        name: Plan
        env:
          MACOS_RUNNER: ${{ vars.DESKTOP_MACOS_RUNNER }}
          MACOS_LOCAL: ${{ vars.DESKTOP_MACOS_LOCAL }}
          LINUX_LOCAL: ${{ vars.DESKTOP_LINUX_LOCAL }}
          WINDOWS_LOCAL: ${{ vars.DESKTOP_WINDOWS_LOCAL }}
          LINUX_ARM_RUNNER: ${{ vars.DESKTOP_LINUX_ARM_RUNNER }}
          STAGING_RELEASES: ${{ vars.DESKTOP_STAGING_RELEASES }}
        run: python3 scripts/ci/plan.py build | tee -a "$GITHUB_STEP_SUMMARY"

  lint:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: [self-hosted, linux, x64, riseonly-desktop-linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: riseonly-desktop
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.plan.outputs.tools_repo }}
          ref: ${{ needs.plan.outputs.tools_ref }}
          ssh-key: ${{ secrets.RISEONLY_TOOLS_SSH_KEY }}
          path: riseonly-tools
          persist-credentials: false
      - name: fmt, boundaries, module tree, canon locales
        run: bash riseonly-desktop/scripts/ci/in-toolchain.sh target-lint bash scripts/ci/lint.sh

  linux:
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.linux_runners)[matrix.arch] }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.linux_archs) }}
    timeout-minutes: 180
    env:
      PROFILE: ${{ needs.plan.outputs.profile }}
      RISE_ENV: ${{ needs.plan.outputs.environment }}
      RISE_BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
      RISE_UPDATE_FEED_PUBLIC_KEY: ${{ vars.DESKTOP_FEED_PUBLIC_KEY }}
      VERSION: ${{ needs.plan.outputs.version }}
      SLUG: ${{ needs.plan.outputs.slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: riseonly-desktop
          persist-credentials: false
          clean: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.plan.outputs.tools_repo }}
          ref: ${{ needs.plan.outputs.tools_ref }}
          ssh-key: ${{ secrets.RISEONLY_TOOLS_SSH_KEY }}
          path: riseonly-tools
          persist-credentials: false
      - if: matrix.arch == 'aarch64' && fromJSON(needs.plan.outputs.linux_local)[matrix.arch] != 'true'
        name: room for the toolchain image and the target dir on the hosted runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: build ${{ needs.plan.outputs.environment }} ${{ matrix.arch }} (${{ needs.plan.outputs.profile }})
        env:
          DESKTOP_CI_CACHE: ${{ matrix.arch == 'aarch64' && fromJSON(needs.plan.outputs.linux_local)[matrix.arch] != 'true' && format('{0}/desktop-ci', runner.temp) || '' }}
          DESKTOP_CI_MEMORY: ${{ matrix.arch == 'aarch64' && '14g' || '' }}
        run: |
          bash riseonly-desktop/scripts/ci/run-build.sh linux "${{ matrix.arch }}" "${{ fromJSON(needs.plan.outputs.linux_local)[matrix.arch] }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: riseonly-desktop/dist/linux/
          retention-days: 7
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timings-linux-${{ matrix.arch }}
          path: riseonly-desktop/timings/
          retention-days: 7
          if-no-files-found: ignore

  windows:
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.windows == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.windows_runner) }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.windows_archs) }}
    timeout-minutes: 180
    env:
      PROFILE: ${{ needs.plan.outputs.profile }}
      RISE_ENV: ${{ needs.plan.outputs.environment }}
      RISE_BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
      RISE_UPDATE_FEED_PUBLIC_KEY: ${{ vars.DESKTOP_FEED_PUBLIC_KEY }}
      VERSION: ${{ needs.plan.outputs.version }}
      SLUG: ${{ needs.plan.outputs.slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: riseonly-desktop
          persist-credentials: false
          clean: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.plan.outputs.tools_repo }}
          ref: ${{ needs.plan.outputs.tools_ref }}
          ssh-key: ${{ secrets.RISEONLY_TOOLS_SSH_KEY }}
          path: riseonly-tools
          persist-credentials: false
      - name: build ${{ needs.plan.outputs.environment }} ${{ matrix.arch }} (${{ needs.plan.outputs.profile }})
        env:
          WIN_ARCH: ${{ matrix.arch }}
        run: |
          bash riseonly-desktop/scripts/ci/run-build.sh windows "${{ matrix.arch }}" "${{ needs.plan.outputs.windows_local }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-windows-${{ matrix.arch }}
          path: riseonly-desktop/dist/windows/
          retention-days: 7
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timings-windows-${{ matrix.arch }}
          path: riseonly-desktop/timings/
          retention-days: 7
          if-no-files-found: ignore

  macos:
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.macos == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.macos_runner) }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.macos_archs) }}
    timeout-minutes: 240
    env:
      PROFILE: ${{ needs.plan.outputs.profile }}
      RISE_ENV: ${{ needs.plan.outputs.environment }}
      RISE_BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
      RISE_UPDATE_FEED_PUBLIC_KEY: ${{ vars.DESKTOP_FEED_PUBLIC_KEY }}
      VERSION: ${{ needs.plan.outputs.version }}
      SLUG: ${{ needs.plan.outputs.slug }}
      MACOS_ARCH: ${{ matrix.arch }}
      MACOS_LOCAL: ${{ needs.plan.outputs.macos_local }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: riseonly-desktop
          persist-credentials: false
          clean: ${{ needs.plan.outputs.macos_local != 'true' }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.plan.outputs.tools_repo }}
          ref: ${{ needs.plan.outputs.tools_ref }}
          ssh-key: ${{ secrets.RISEONLY_TOOLS_SSH_KEY }}
          path: riseonly-tools
          persist-credentials: false
      - if: env.MACOS_LOCAL != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ needs.plan.outputs.rust }}
          targets: x86_64-apple-darwin
      - if: env.MACOS_LOCAL != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: riseonly-desktop -> target
          key: ${{ needs.plan.outputs.profile }}-${{ matrix.arch }}
          cache-on-failure: true
      - if: env.MACOS_LOCAL != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: riseonly-desktop/vendor/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('riseonly-desktop/scripts/build-ffmpeg-lgpl.sh') }}
      - run: brew list pkgconf >/dev/null 2>&1 || brew install pkgconf
      - if: matrix.arch == 'x86_64'
        run: brew list nasm ninja >/dev/null 2>&1 || brew install nasm ninja
      - name: build ${{ needs.plan.outputs.environment }} ${{ matrix.arch }} (${{ needs.plan.outputs.profile }})
        working-directory: riseonly-desktop
        run: |
          rm -rf dist timings
          if [ "$MACOS_LOCAL" = true ]; then
            [ "$MACOS_ARCH" != x86_64 ] || rustup target add x86_64-apple-darwin
            caffeinate -i /usr/bin/lockf -k /tmp/riseonly-desktop-build.lock bash scripts/ci/build-macos.sh
          else
            bash scripts/ci/build-macos.sh
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: riseonly-desktop/dist/macos/
          retention-days: 7
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timings-macos-${{ matrix.arch }}
          path: riseonly-desktop/timings/
          retention-days: 7
          if-no-files-found: ignore

  tests:
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.tests == 'true'
    runs-on: [self-hosted, linux, x64, riseonly-desktop-linux]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: riseonly-desktop
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.plan.outputs.tools_repo }}
          ref: ${{ needs.plan.outputs.tools_ref }}
          ssh-key: ${{ secrets.RISEONLY_TOOLS_SSH_KEY }}
          path: riseonly-tools
          persist-credentials: false
      - name: cargo test and clippy
        run: bash riseonly-desktop/scripts/ci/in-toolchain.sh target-tests bash scripts/ci/test.sh
