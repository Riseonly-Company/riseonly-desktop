# why: X2352, a build script's set_var does not reach the build script of rusty_ffmpeg
# (rsmpeg), so without this it probes Homebrew's GPL FFmpeg. Linux and Windows builds export
# FFMPEG_PKG_CONFIG_PATH for their own prefix (linux-check.sh, windows-check.sh, ci/build-*.sh),
# and a variable already in the environment wins over this default.
[env]
FFMPEG_PKG_CONFIG_PATH = { value = "vendor/ffmpeg/macos-arm64/lib/pkgconfig", relative = true }
# why: the app tree is compiled by several crates at different depths (scripts/crate-views.json), so a
# source file finds assets and scripts from the workspace root, not from its crate's manifest directory.
RISE_WORKSPACE_DIR = { value = "", relative = true }

# why: the prebuilt libwebrtc webrtc-sys links on Windows is built against the static CRT (/MT),
# so every other object of riseonly.exe has to match or lld-link stops at RuntimeLibrary.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
