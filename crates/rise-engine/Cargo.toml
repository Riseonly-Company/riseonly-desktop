[package]
name = "rise-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true
parking_lot.workspace = true
tracing.workspace = true
rusqlite.workspace = true
aes-gcm.workspace = true
rand.workspace = true
sha2.workspace = true
reqwest.workspace = true
smallvec.workspace = true
fs4.workspace = true
rise-core.workspace = true
# The OS secret store seam behind RiseSecureKeyStore (A1-riseengine-001, X17), plus FileManager,
# system_activity and url_resource_values. why: a path, not workspace inheritance, because cargo ignores
# default-features = false on an inherited dependency whose workspace entry keeps the defaults; without
# the gpui feature the engine graph holds no gpui (X30, ARCHITECTURE_BOUNDARIES.md section 1).
rise-platform = { path = "../rise-platform", default-features = false }
# RiseRpcCanon and the shared request id allocator of rise-rpc (A1-riseengine-001, T01).
rise-canon.workspace = true
# Store limits, write policy, preconditions and view keys from the canon (A1-riseengine-006, T09).
rise-store.workspace = true
# Sealed frame bounds and key length for RiseAESGCMStoreCipher (A1-riseengine-004, T09).
rise-crypto.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
