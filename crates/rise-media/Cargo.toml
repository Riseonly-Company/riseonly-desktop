[package]
name = "rise-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Links libavcodec through rsmpeg. Requires the LGPL prefix from
# scripts/build-ffmpeg-lgpl.sh; build.rs refuses to guess at a system FFmpeg
# because every distribution's default is GPL.
ffmpeg = ["dep:rsmpeg"]
# Compiles the vendored rlottie (MIT) into the crate. Requires the source from
# scripts/vendor-rlottie.sh; build.rs refuses to look for a system librlottie
# because no operating system ships one.
rlottie = []

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
gpui.workspace = true
rise-core.workspace = true
rise-platform.workspace = true
rsmpeg = { version = "0.16", default-features = false, features = ["ffmpeg7", "link_system_ffmpeg"], optional = true }
cpal = "0.16"
# Codec set chosen against what the backend actually accepts (file-service
# upload_policy.rs) minus what has no pure-Rust decoder. Opus is the gap and is
# reported by name rather than silently producing silence.
symphonia = { version = "0.5", default-features = false, features = [
    "mp3",
    "aac",
    "alac",
    "flac",
    "caf",
    "isomp4",
    "ogg",
    "vorbis",
    "wav",
    "pcm",
    "adpcm",
] }
image = { version = "0.25", default-features = false }
smallvec.workspace = true
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[build-dependencies]
cc = "1"
