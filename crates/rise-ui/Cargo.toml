[package]
name = "rise-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
# `Shared<Task<_>>`: two elements asking for the same image on one frame must
# await ONE decode, not start two. gpui's own image cache does the same thing
# with the same combinator.
futures.workspace = true
serde.workspace = true
smallvec.workspace = true
tracing.workspace = true
gpui.workspace = true
rise-core.workspace = true
# FlagUi is the one component whose drawing depends on what the host's text
# stack can render. It still never names an OS: rise-platform answers whether a
# regional-indicator pair becomes a flag on this machine.
rise-platform.workspace = true
rise-theme.workspace = true
rise-i18n.workspace = true

[dev-dependencies]
# The bundled faces have to be proved to RESOLVE, not merely to exist on disk:
# Inter's Medium and SemiBold carry their own legacy family names, so a family
# query can silently answer Regular. Proving otherwise needs a real text system.
gpui = { workspace = true, features = ["test-support"] }

[build-dependencies]
# Reads assets/icons/sf-to-lucide.json once, at build time, so a missing icon is
# a build failure rather than a blank square in a screenshot.
serde = { workspace = true }
serde_json.workspace = true
