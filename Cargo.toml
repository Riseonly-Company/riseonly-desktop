[workspace]
resolver = "3"
members = ["crates/*", "app"]
exclude = ["vendor/gpui-6b2aa1c"]

[workspace.package]
version = "1.1.4"
edition = "2024"
rust-version = "1.95"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
gtk = "0.18"
gdkx11 = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
javascriptcore-rs = { version = "1.1", features = ["v2_28"] }
rise-core = { path = "crates/rise-core" }
rise-i18n = { path = "crates/rise-i18n" }
rise-engine = { path = "crates/rise-engine" }
rise-platform = { path = "crates/rise-platform" }
rise-theme = { path = "crates/rise-theme" }
rise-ui = { path = "crates/rise-ui" }
rise-widgets = { path = "crates/rise-widgets" }
rise-media = { path = "crates/rise-media" }
rise-navigation = { path = "crates/rise-navigation" }

# Shared core from riseonly-tools: one canon for four trees, the generator lays it out
# in Rust, Swift and Kotlin. The desktop links the crates directly and pays for no bridge.
# Values are never edited here: the source is ../riseonly-tools/canon, the gate is `codegen check`.
#
# Linked: what the desktop has NONE of at all; a pure gain, nothing to replace.
rise-perm = { path = "../riseonly-tools/crates/rise-perm" }
rise-moderation = { path = "../riseonly-tools/crates/rise-moderation" }
rise-rtc = { path = "../riseonly-tools/crates/rise-rtc" }
rise-music = { path = "../riseonly-tools/crates/rise-music" }
rise-limits = { path = "../riseonly-tools/crates/rise-limits" }
rise-events = { path = "../riseonly-tools/crates/rise-events" }
rise-catalog = { path = "../riseonly-tools/crates/rise-catalog" }
rise-chat = { path = "../riseonly-tools/crates/rise-chat" }
rise-endpoints = { path = "../riseonly-tools/crates/rise-endpoints" }
rise-regions = { path = "../riseonly-tools/crates/rise-regions" }
rise-bot-api = { path = "../riseonly-tools/crates/rise-bot-api" }
#
# Linked in place of a desktop duplicate: the canon schemas are the rules.
rise-validate = { path = "../riseonly-tools/crates/rise-validate" }
#
# Linked for deep link parsing from canon; rise-platform routes through it (X26).
rise-deeplink = { path = "../riseonly-tools/crates/rise-deeplink" }
#
# Linked in place of the desktop notification policy: scopes, mute window, self authorship
# and route are canon; rise-platform keeps only the presenter seam (A1-platform-002).
rise-notify = { path = "../riseonly-tools/crates/rise-notify" }
#
# Linked as the generated client facade (docs/DEPENDENCIES.md): upload formats and
# context_accepts_extension for rise-platform file dialogs (X27, A1-platform-003).
rise-canon = { path = "../riseonly-tools/crates/rise-canon" }
rise-notification-texts = { path = "../riseonly-tools/crates/rise-notification-texts" }
#
# Linked for the store contract: limits, write policy, version preconditions, view keys and
# cipher context domains (T09, A1-riseengine-003..007). The crate name equals the rise-engine
# module rise_store, so rise-engine code names it ::rise_store.
rise-store = { path = "../riseonly-tools/crates/rise-store" }
#
# Linked for the sealed value frame and key length of the store cipher; the AEAD itself stays
# aes-gcm (T09, A1-riseengine-004).
rise-crypto = { path = "../riseonly-tools/crates/rise-crypto" }
#
# Linked in place of the desktop avatar palette: key, hash, palette and letter are canon, the
# theme only turns the canon bytes into colours (T09, A1-core-lib-020).
rise-avatar = { path = "../riseonly-tools/crates/rise-avatar" }
#
# Linked for the refusal dictionary, presentation rules and relative time bands that
# CanonErrors and CanonFormat read (T09, A1-core-lib-018).
rise-errors = { path = "../riseonly-tools/crates/rise-errors" }
rise-format = { path = "../riseonly-tools/crates/rise-format" }
rise-gifts = { path = "../riseonly-tools/crates/rise-gifts" }
#
# Linked for the channels a one-time code travels by: AuthCodeChannel wire spellings are canon.
rise-otp = { path = "../riseonly-tools/crates/rise-otp" }
rise-privacy = { path = "../riseonly-tools/crates/rise-privacy" }
rise-i18n-catalog = { path = "../riseonly-tools/crates/rise-i18n-catalog" }

# Read through rise-canon, not named here: rise-theme-tokens (rise_canon::rise_theme_tokens is the
# palette and colour parsing of crates/rise-theme, T35, A1-theme-001).
#
# NOT linked; each needs its own decision, not a side effect of copying:
#
# rise-wire, rise-sync, rise-rpc, rise-upload, rise-shapes:
#   crates/rise-engine takes their place.


gpui = { git = "https://github.com/zed-industries/zed", rev = "6b2aa1c90aeb72cadfd30ed12141ed9e2569eded" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "6b2aa1c90aeb72cadfd30ed12141ed9e2569eded", features = [
    "font-kit",
    "x11",
    "wayland",
] }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
futures = "0.3"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.37", features = ["bundled"] }
aes-gcm = "0.10"
rand = "0.9"
sha2 = "0.10"
directories = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
# The trust roots of the OS for reqwest and the sockets (X24): the same rustls 0.23 reqwest and tokio-tungstenite link.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-platform-verifier = "0.7"
smallvec = "1"
fs4 = "0.13"
base64 = "0.22"
hmac = "0.12"
url = "2.5"
unicode-segmentation = "1.13.3"
unicode-normalization = "0.1.24"
regex = "1.13.1"
# QR matrix without CoreImage; the image feature is off, the kit rasterizes itself.
qrcode = { version = "=0.14.1", default-features = false }
tiny-skia = "=0.11.4"
# QR reading from camera frames and pictures (RiseQRScanResolver), the Vision/CIDetector stand-in.
rqrr = { version = "=0.11.0", default-features = false }
# Calendar and zone rules for the Foundation twins: system tzdata on
# macOS and Linux, the bundled database on Windows.
jiff = "=0.2.39"
# CLDR names and style patterns for the DateFormatter twin, same data Apple
# formats with through ICU.
icu_datetime = "=2.4.0"
icu_calendar = "=2.4.0"
icu_locale_core = "=2.4.0"
# why: without `sync` ICU payloads hold Rc, so DateFormatter is not Send and the shared statics of
# iOS (`static let formatter`) cannot be written; the crate is already in the lock through icu_datetime.
icu_provider = { version = "=2.4.0", features = ["sync"] }
# Sort orders for the compare(_:locale:) and localizedCaseInsensitiveCompare twins, the same CLDR
# data Apple sorts with through ICU.
icu_collator = "=2.4.0"
# Relative time phrases for the RelativeDateTimeFormatter twin, the same CLDR data Apple formats
# with through ICU; this release is pinned to icu 2.4.
icu_experimental = "=0.7.0"
fixed_decimal = "=0.7.3"
writeable = "=0.6.4"
# Decimal twin (StorePrice prices); the currency format data is taken
# from Foundation by crates/rise-i18n/tools/gen_currency_format.swift, not from a crate.
rust_decimal = { version = "=1.36.0", default-features = false, features = ["std"] }

# Only to read the NSView out of a `gpui::Window`. Must stay semver-compatible
# with what gpui resolves, or `HasWindowHandle` is a different trait and the
# call does not exist.
raw-window-handle = "0.6"

# Native seams for Phase 3. Versions match what this gpui rev already resolves,
# so the tray does not drag a second copy of the objc2 or windows families in.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
windows = { version = "0.62", features = [
    "ApplicationModel_DataTransfer",
    "Data_Xml_Dom",
    "Foundation",
    "Storage",
    "UI_Notifications",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# IIterable<T> from a Vec for WinRT setters (DataPackage.SetStorageItems); the windows crate
# takes it from this crate of the same family without re-exporting it.
windows-collections = "0.3"
# The windows `implement` macro expands to paths of windows-core; COM objects of ours
# (IMFMediaEngineNotify in rise-media av_player, P105) need it as a direct dependency.
windows-core = "0.62"
# WebView2 COM interfaces and the environment loader for the Windows branch of the web_view
# seam (P109, X28): the windows crate carries no WebView2 bindings. 0.39 is the line built on
# windows 0.62, so the family stays single in Cargo.lock.
webview2-com = "=0.39.1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }
# Linux display_cadence (P100): the same x11rb, wayland-client and wayland-backend gpui_linux
# already resolves, so no new crate enters Cargo.lock; randr reads the CRTC mode, client_system
# lets a guest queue share gpui's own wl_display.
x11rb = { version = "0.13", features = ["allow-unsafe-code", "randr"] }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
# Linux pasteboard_write (P116): the data control protocols gpui_linux already resolves (with the
# same client and staging features), so no new crate enters Cargo.lock.
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# gpui at the pinned rev with the Riseonly patches (P41): off macOS a PaintSurface carries a CPU
# NV12 frame and the wgpu renderer draws it. The patched crates below are vendored, all Apache-2.0;
# the tree is generated by scripts/vendor-gpui.py from the same rev, never edited by hand.
[patch."https://github.com/zed-industries/zed"]
gpui = { path = "vendor/gpui-6b2aa1c/crates/gpui" }
gpui_wgpu = { path = "vendor/gpui-6b2aa1c/crates/gpui_wgpu" }
# X731: the Metal renderer with patches 0005 (32BGRA surfaces of clips with alpha, P292), 0007 and the rest.
gpui_macos = { path = "vendor/gpui-6b2aa1c/crates/gpui_macos" }
# P195: Wayland finger scrolls carry Started/Ended (patch 0009), the two-finger back gesture needs them.
gpui_linux = { path = "vendor/gpui-6b2aa1c/crates/gpui_linux" }
# P42, P64, P149, P220: the DirectX 11 renderer and the Win32 platform with patches 0002, 0003, 0008 and the rest.
gpui_windows = { path = "vendor/gpui-6b2aa1c/crates/gpui_windows" }

# P256: the signal WebSocket of LiveKit takes its TCP stream from the app's transport, so it follows
# the system proxy. One function added; the tree is generated by scripts/vendor-livekit-api.py.
[patch.crates-io]
livekit-api = { path = "vendor/livekit-api-0.4.14" }
# X148: a Rust file source of the map core can answer one request many times (Responder::send), for
# revalidation on Expires on Linux (P264). The tree is generated by scripts/vendor-maplibre-native.py.
maplibre_native = { path = "vendor/maplibre_native-0.10.0" }
# The Rust types the C++ side holds are forward-declared as struct, as cxx defines them, so clang-cl
# links the Windows build (scripts/vendor-webrtc-sys.py).
webrtc-sys = { path = "vendor/webrtc-sys-0.3.23" }

[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package.gpui]
opt-level = 3

[profile.dev.package.gpui_platform]
opt-level = 3

[profile.dev.package.gpui_macos]
opt-level = 3

[profile.dev.package.gpui_wgpu]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
# The tree mirrors riseonly-ios file for file, and the reference names a
# subsystem's hub file after its folder (RiseSync/RiseSync.swift,
# pages/Onboarding/Onboarding.swift). Parity is checkable; this lint is taste.
module_inception = "allow"

# The debug build lagged. Same debug assertions and dev tools (debugger, dev-drive), optimised code.
[profile.devopt]
inherits = "dev"
opt-level = 2
debug = "line-tables-only"
debug-assertions = true
overflow-checks = false
incremental = true

# Near-release speed for manual trials and perf measurement, without the hour-long fat LTO link of release.
[profile.fast]
inherits = "release"
lto = false
# why: a one-file fix rebuilt the whole app crate in 10+ minutes; incremental with
# many units recompiles only what changed, at a small cost in codegen quality.
codegen-units = 256
incremental = true
strip = "none"
debug = "line-tables-only"

# why: the edit loop of scripts/watch-macos.sh; own code unoptimised with line tables only,
# every dependency optimised once so the window stays usable while the app crate recompiles fast.
[profile.watch]
inherits = "dev"
debug = "line-tables-only"

[profile.watch.package."*"]
opt-level = 2
debug = false
